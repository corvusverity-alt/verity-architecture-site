<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="160" viewBox="0 0 600 160" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Verity Architecture</title>
  <desc>Verity Architecture horizontal wordmark — three ascending gold pillars mark beside VERITY ARCHITECTURE in gold on transparent background</desc>

  <!-- Badge circle -->
  <circle cx="80" cy="80" r="55" fill="#1A1A2E" stroke="#C9A84C" stroke-width="2.5"/>

  <!-- Three ascending gold pillars (bottom-aligned at y=122) -->
  <rect x="55"  y="94"  width="14" height="28" fill="#C9A84C"/>
  <rect x="73"  y="77"  width="14" height="45" fill="#C9A84C"/>
  <rect x="91"  y="59"  width="14" height="63" fill="#C9A84C"/>

  <!-- Cap line -->
  <line x1="55" y1="59" x2="105" y2="59" stroke="#C9A84C" stroke-width="2.5"/>

  <!-- Foundation bar -->
  <rect x="55" y="122" width="50" height="4" fill="#C9A84C"/>

  <!-- VERITY wordmark -->
  <text x="155" y="74" font-family="Georgia,'Times New Roman',serif"
        font-size="52" font-weight="700" fill="#C9A84C">VERITY</text>

  <!-- Gold rule -->
  <line x1="155" y1="84" x2="560" y2="84" stroke="#C9A84C" stroke-width="1.2"/>

  <!-- ARCHITECTURE sub-wordmark -->
  <text x="157" y="104" font-family="Arial,Helvetica,sans-serif"
        font-size="14" font-weight="400" fill="#C9A84C" letter-spacing="6">ARCHITECTURE</text>

  <!-- Byline -->
  <text x="159" y="128" font-family="Georgia,'Times New Roman',serif"
        font-size="12" font-style="italic" fill="#8A6B28">Corvus Verity</text>
</svg>
